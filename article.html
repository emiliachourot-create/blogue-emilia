<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Article | Émilia</title>
<meta name="description" id="pageDescription" content="">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a href="index.html" class="logo">Émilia<span>.</span></a>
    <nav class="main-nav" aria-label="Navigation principale">
      <a href="index.html" aria-current="page">Blogue</a>
      <a href="#">Résidentiel</a>
      <a href="#">Commercial</a>
      <a href="#">RPA / RI</a>
      <a href="#">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
  </div>
</header>

<main class="page">
  <aside class="sidebar">
    <div class="sidebar__label">Catégories</div>
    <ul class="sidebar__list">
      <li><a href="index.html">Tous les articles</a></li>
      <li><a href="index.html">Résidentiel</a></li>
      <li><a href="index.html">Commercial</a></li>
      <li><a href="index.html">RPA / RI</a></li>
    </ul>
  </aside>

  <article id="articleContent">
    <!-- Rempli dynamiquement selon l'article demandé dans l'URL -->
  </article>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <img src="images/sutton-logo.png" alt="Sutton" class="site-footer__logo">
      <span>© 2026 Émilia Chourot — Courtier immobilier résidentiel et commercial, Groupe Sutton Actuel Inc.</span>
    </div>
    <nav aria-label="Navigation de pied de page">
      <a href="#">Contact</a> · <a href="#">À propos</a> · <a href="https://www.suttonquebec.com/" target="_blank" rel="noopener">Sutton Québec</a>
    </nav>
  </div>
</footer>

<script src="articles.js"></script>
<script>
// Lit le slug de l'article demandé dans l'URL (?p=...) et affiche
// le bon contenu à partir des données partagées dans articles.js.
const params = new URLSearchParams(window.location.search);
const slug = params.get("p");
const article = articles.find(a => a.slug === slug) || articles[0];
const container = document.getElementById("articleContent");

if (!article) {
  container.innerHTML = `
    <p>Cet article est introuvable. <a href="index.html">Retourner au blogue</a>.</p>
  `;
} else {
  document.title = article.title + " | Émilia";
  document.getElementById("pageTitle").textContent = article.title + " | Émilia";
  document.getElementById("pageDescription").setAttribute("content", article.description);

  container.innerHTML = `
    <a href="index.html" class="back-link">← Retour aux articles</a>
    <div class="article-header">
      <span class="tag" style="${tagStyle(article.category)}">${article.category}</span>
      <h1>${article.title}</h1>
      <div class="article-meta">Publié le ${article.date} · ${article.readTime}</div>
    </div>
    <img class="article-hero" src="${article.photo}" alt="${article.title}">
    <div class="article-body">${article.body}</div>
  `;
}
</script>

</body>
</html>
